[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-digital-twin"
version = "0.1.0"
description = "Gemelo digital discreto de una linea de fabricacion PET"
requires-python = ">=3.11"
dependencies = [
  "simpy>=4.1,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[project.scripts]
pet-sim = "simulation.cli:main"
pet-deploy = "deployment.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["simulation*", "api*", "deployment*"]

